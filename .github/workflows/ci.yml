name: CI — SafeMotion AI API & MCP Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🛡️ Pytest Suite (18 Tests) & Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint with Ruff
        run: ruff check src/ tests/ demo.py --select=E9,F63,F7,F82

      - name: Run 18-test verification suite
        run: pytest tests/ -v --tb=short
